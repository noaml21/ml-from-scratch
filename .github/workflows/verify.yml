name: Verify MLForge
on:
  pull_request:
    branches: [v1/mlforge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,demos]' -c requirements/constraints-dev.txt
      - run: python -m pip check
      - run: python scripts/verify_package.py --prepare-wheelhouse
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python demos/kmeans_comparison.py
      - run: python demos/logistic_regression_comparison.py
      - run: python demos/pca_comparison.py
      - run: python scripts/verify_package.py
      - run: python docs/v1/verify_planning.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-evidence-${{ matrix.python }}
          path: |
            .mlforge-build/package-*.json
            .mlforge-build/consumer-*.json
          include-hidden-files: true
